name: main_312m_hybrid
manifest: /path/to/manifest.jsonl
output_dir: runs/main_312m_hybrid
model:
  preset: hybrid-medium
  backbone: hybrid_mamba
  # Rotary positions in the local-attention layers: relative offsets only,
  # bounded by the window, so whole-song carry never extrapolates positions.
  position_encoding: rope
  # 2048 is smaller than a worst-case chunk (~505 conditioning tokens +
  # 2000 MIDI tokens): late MIDI tokens could not attend to their own
  # chunk's mel frames.  4096 always covers the current chunk.
  local_window: 4096
stages:
  - name: slakh_pretrain
    steps: 150000
    context_chunks: 1
    datasets: [slakh2100_redux]
  - name: real_mix_5s
    steps: 85000
    context_chunks: 1
    datasets:
      - slakh2100_redux
      - choralebricks
      - musicnet_em
      - maestro
      - gaps
      - guitarset
      - mir1k
      - enst_drums
      - mdb_drums_pp
      - star_drums_preview
      - idmt_smt_bass
    dataset_weights: &real_dataset_weights
      slakh2100_redux: 0.20
      choralebricks: 0.20
      musicnet_em: 0.20
      maestro: 0.05
      gaps: 0.05
      guitarset: 0.05
      mir1k: 0.05
      enst_drums: 0.05
      mdb_drums_pp: 0.05
      star_drums_preview: 0.05
      idmt_smt_bass: 0.05
  # The long-context stages are the point of the architecture; under the
  # single global cosine they trained at <3% of the base LR.  lr_scale +
  # rewarm_steps give each stage its own re-warmed cosine (see
  # muscriptor/training/schedule.py) at a meaningful learning rate.
  - name: context_10s
    steps: 15000
    context_chunks: 2
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 1000
  - name: context_20s
    steps: 15000
    context_chunks: 4
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 1000
  - name: context_40s
    steps: 15000
    context_chunks: 8
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 1000
optimizer:
  learning_rate: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 2000
  gradient_clip: 1.0
distributed: ddp
precision: bfloat16
global_batch_audio_seconds: 320
condition_dropout: 0.2
# 15% of chunks see a perturbed tie prologue with masked labels, training
# robustness to imperfect forced preludes / carried state at inference.
tie_corruption: 0.15
gradient_checkpointing: true
num_workers: 8
log_every: 20
save_every: 2000
distillation:
  teacher_checkpoint: null
  weight: 0.25
  temperature: 2.0
