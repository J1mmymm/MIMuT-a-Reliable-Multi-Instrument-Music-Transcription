name: ablation_106m_hybrid
manifest: /path/to/manifest.jsonl
output_dir: runs/ablation_106m_hybrid
# Change backbone to local_transformer, pure_mamba, or transformer while
# keeping the remaining training/data budget fixed.
model:
  preset: hybrid-small
  backbone: hybrid_mamba
  position_encoding: rope
  local_window: 4096
stages:
  - name: slakh_pretrain
    steps: 30000
    context_chunks: 1
    datasets: [slakh2100_redux]
  - name: real_mix_5s
    steps: 25000
    context_chunks: 1
    datasets:
      - slakh2100_redux
      - choralebricks
      - musicnet_em
      - maestro
      - gaps
      - guitarset
      - mir1k
      - enst_drums
      - mdb_drums_pp
      - star_drums_preview
      - idmt_smt_bass
    dataset_weights: &real_dataset_weights
      slakh2100_redux: 0.20
      choralebricks: 0.20
      musicnet_em: 0.20
      maestro: 0.05
      gaps: 0.05
      guitarset: 0.05
      mir1k: 0.05
      enst_drums: 0.05
      mdb_drums_pp: 0.05
      star_drums_preview: 0.05
      idmt_smt_bass: 0.05
  - name: context_10s
    steps: 5000
    context_chunks: 2
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 500
  - name: context_20s
    steps: 5000
    context_chunks: 4
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 500
  - name: context_40s
    steps: 5000
    context_chunks: 8
    dataset_weights: *real_dataset_weights
    lr_scale: 0.3
    rewarm_steps: 500
optimizer:
  learning_rate: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 2000
  gradient_clip: 1.0
distributed: ddp
precision: bfloat16
global_batch_audio_seconds: 320
condition_dropout: 0.2
tie_corruption: 0.15
gradient_checkpointing: true
num_workers: 8
log_every: 20
save_every: 2000
